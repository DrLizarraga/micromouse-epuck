#VRML_SIM R2025a utf8
# template language: javascript
# Pared del laberinto Micromouse (estandar IEEE clasico):
# 18 cm entre centros de postes -> 16.8 cm de pared entre postes,
# 1.2 cm de grosor, 5 cm de alto. Lados blancos y tapa roja.
# El eje x local va a lo largo de la pared; translation es el centro de la base.
# Nota: los sensores IR del e-puck dependen del color (rojo) y de la rugosidad
# del material; roughness 0 y blanco dan la reflexion maxima (factor 1).

PROTO MazeWall [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "pared"
  field SFFloat    length      0.168
  field SFFloat    thickness   0.012
  field SFFloat    height      0.05
]
{
  %<
    const p = fields.translation.value;
    const L = fields.length.value;
    const T = fields.thickness.value;
    const H = fields.height.value;
  >%
  Solid {
    translation %<= p.x >% %<= p.y >% %<= p.z + H / 2 >%
    rotation IS rotation
    name IS name
    children [
      Shape {
        appearance PBRAppearance {
          baseColor 1 1 1
          roughness 0
          metalness 0
        }
        geometry Box {
          size %<= L >% %<= T >% %<= H >%
        }
      }
      Pose {
        translation 0 0 %<= H / 2 + 0.0005 >%
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.8 0 0
              roughness 1
              metalness 0
            }
            geometry Box {
              size %<= L >% %<= T >% 0.001
            }
          }
        ]
      }
    ]
    boundingObject Box {
      size %<= L >% %<= T >% %<= H >%
    }
    model "MazeWall"
  }
}
